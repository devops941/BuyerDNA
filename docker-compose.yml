version: '3.8'

services:
  ml-service:
    build:
      context: ./backend/ml-service
      dockerfile: Dockerfile
    container_name: buyerdna-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - API_PREFIX=/ml
      - SERVICE_SECRET_KEY=buyer_dna_internal_secure_key_2026
      - DEBUG=False
    networks:
      - buyerdna-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ml/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buyerdna-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb+srv://devops_db_user:FmSuxxKg4ZYRomyt@cluster0.bsyn8gp.mongodb.net/buyer_dna?retryWrites=true&w=majority
      - JWT_SECRET=buyer_dna_production_jwt_secret_key_2026
      - JWT_EXPIRES_IN=7d
      - ML_SERVICE_URL=http://ml-service:8000/ml
      - CLIENT_URL=http://localhost:5173
      - UPLOAD_DIR=uploads
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      ml-service:
        condition: service_healthy
    networks:
      - buyerdna-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: buyerdna-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - buyerdna-network

networks:
  buyerdna-network:
    driver: bridge
